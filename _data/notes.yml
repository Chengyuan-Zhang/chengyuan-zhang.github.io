# Reading order for /notes/.
#
# This file controls order, topics, and placeholders only. For `post:` entries
# the link and the title are read from the post itself, so they can never fall
# out of sync with _posts/. Any post not listed here is appended automatically
# at the end of the list, so a new post can never go missing either.
#
# Entry kinds:
#   post:    permalink of a file in _posts/. Title comes from the post.
#   label:   optional short display name, for when the real title is too long.
#   link:    an external URL. Requires label.
#   planned: a note that is not written yet. Rendered without a link.
#   topics:  ids from _data/note_topics.yml.

